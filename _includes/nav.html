<nav>
  <ul>
    {% assign nav_pages = site.html_pages | sort: "nav_order" %}
    {% for p in nav_pages %}
      <li>
        <a href="{{ p.url | relative_url }}"
           {% if p.url == page.url %}aria-current="page"{% endif %}>
          {{ p.title }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>
