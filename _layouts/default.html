<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      line-height: 1.5;
    }

    header {
      background: #222;
      color: white;
      padding: 1rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 0.35rem 0.6rem;
      border-radius: 4px;
    }

    nav a[aria-current="page"] {
      background: white;
      color: #222;
    }

    main {
      padding: 1.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
    {% include nav.html %}
  </header>

  <main>
    {{ content }}
  </main>
</body>
</html>
